# The pull-request gate. Upstream benilla runs no CI and never builds the wasm target, so a
# wasm-only break (a tuple that became a struct, a std::time::Instant) is invisible to it and to a
# native `cargo check` here. This is where it is caught before it reaches `main`.
#
# The wasm target is checked, and the Android target (the `android` job, a type check through the
# NDK); browser/host tests and targeted client-carry tests catch behavior regressions after
# upstream merges. These need no game data. The full workspace test suite needs a 1.12.1 patch
# chain and is not run here.
name: check
on:
  pull_request:
  push:
    branches: [main]
  # By hand, on any branch: for a PR whose event GitHub dropped, or a branch with no PR yet.
  workflow_dispatch:
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
          cache-directories: tools
      # wasi-sdk is the C sysroot the Lua VM's build script needs even for `cargo check`; the
      # script also installs wasm-bindgen-cli at Cargo.lock's exact version, which `check` does
      # not use but a later `web-build.sh` step would. Both land under tools/ and ~/.cargo/bin,
      # which the cache above keeps.
      - name: toolchain (scripts/web-setup.sh)
        run: scripts/web-setup.sh
      - name: cargo check, wasm32
        run: cargo check --target wasm32-unknown-unknown -p wenilla --no-default-features --features webgpu
  host-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: host
      - name: browser startup and journal regressions
        run: node --test web/tests/*.test.mjs
      - name: host cache and relay regressions
        run: cargo test -p wenilla-host
      - name: UI listener ordering and mutation
        run: |
          cargo test -p benilla-ui --lib script::tests::events
          cargo test -p benilla-ui --lib wenilla_listener
  client-carries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: client-carries
      - name: native Bevy dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      # Compare the small carry against upstream's original math after every merge.
      - name: rig composition equivalence and browser budget
        run: |
          cargo test -p benilla-world --lib rig_anim::compose --no-default-features
          cargo test -p benilla-world --lib web_budget --no-default-features
  # The Android launcher (docs/ANDROID.md, P6): a type check of the cdylib for aarch64-linux-android.
  # Like the wasm job, this catches a target-only break (a `cfg(not(wasm32))` arm that assumes a
  # desktop) that neither upstream nor a native `cargo check` sees. The NDK's clang is needed even
  # for `check`, because `lua-src`'s `cc` build script runs; cargo-ndk points cargo at it
  # (`CC_aarch64_linux_android`, the linker) from `ANDROID_NDK_HOME`. ci.yml's own job deletes the
  # runner's preinstalled `/usr/local/lib/android`, so nothing preinstalled is assumed here: the NDK
  # comes from setup-ndk, at the r28 line `scripts/android-setup.sh` asks for (16 KB pages by
  # default). No SDK and no Gradle: the APK itself is built by the operator (`make android`).
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml's channel, plus the Android target.
      - name: toolchain
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android
          rustc -V
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          link-to-sdk: false
      # ~/.cargo/bin is in the cache above, so the install runs once per lockfile change.
      - name: cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked
      - name: cargo check, aarch64-linux-android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -P 29 check -p warcraft-survivors-android --no-default-features
